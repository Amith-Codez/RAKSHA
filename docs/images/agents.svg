<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6D4AFF"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="1280" height="780" rx="24" fill="#FBF8F3"/>
  <text x="40" y="58" font-size="28" font-weight="800" fill="#1A1530">11 agents, one courtroom</text>
  <text x="40" y="86" font-size="15" fill="#5B5670">They hand off work at runtime, argue charge by charge, and hard evidence always has the last word.</text>

  <!-- column frames -->
  <g fill="#FFFFFF" stroke="#E6DFF7" stroke-width="1.5">
    <rect x="40" y="112" width="270" height="530" rx="20"/>
    <rect x="340" y="112" width="270" height="530" rx="20"/>
    <rect x="640" y="112" width="270" height="530" rx="20"/>
    <rect x="940" y="112" width="300" height="530" rx="20"/>
  </g>

  <!-- column headers -->
  <g font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    <circle cx="70" cy="146" r="14" fill="#6D4AFF"/><text x="70" y="151">1</text>
    <circle cx="370" cy="146" r="14" fill="#0E8A7E"/><text x="370" y="151">2</text>
    <circle cx="670" cy="146" r="14" fill="#E11D48"/><text x="670" y="151">3</text>
    <circle cx="970" cy="146" r="14" fill="#D08700"/><text x="970" y="151">4</text>
  </g>
  <g font-size="18" font-weight="800" fill="#1A1530">
    <text x="94" y="152">READ</text><text x="394" y="152">INVESTIGATE</text>
    <text x="694" y="152">DEBATE</text><text x="994" y="152">DECIDE</text>
  </g>
  <g font-size="12.5" fill="#8A84A3">
    <text x="58" y="178">understand the ad, plan the case</text>
    <text x="358" y="178">five specialists gather evidence</text>
    <text x="658" y="178">charges are filed and answered</text>
    <text x="958" y="178">rule on what is still contested</text>
  </g>

  <!-- reusable row style: rect + badge + name + 2 job lines -->
  <!-- READ -->
  <g>
    <rect x="56" y="194" width="238" height="74" rx="14" fill="#F4F1FF"/>
    <circle cx="84" cy="231" r="16" fill="#6D4AFF"/><text x="84" y="236" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">O</text>
    <text x="110" y="222" font-size="15" font-weight="700" fill="#1A1530">Orchestrator</text>
    <text x="110" y="241" font-size="12" fill="#4A4560">runs the case, keeps step</text>
    <text x="110" y="257" font-size="12" fill="#4A4560">and time budgets</text>

    <rect x="56" y="278" width="238" height="74" rx="14" fill="#F4F1FF"/>
    <circle cx="84" cy="315" r="16" fill="#6D4AFF"/><text x="84" y="320" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">E</text>
    <text x="110" y="306" font-size="15" font-weight="700" fill="#1A1530">Extractor</text>
    <text x="110" y="325" font-size="12" fill="#4A4560">reads the ad, even a picture,</text>
    <text x="110" y="341" font-size="12" fill="#4A4560">into a sheet of claims</text>

    <rect x="56" y="362" width="238" height="74" rx="14" fill="#F4F1FF"/>
    <circle cx="84" cy="399" r="16" fill="#6D4AFF"/><text x="84" y="404" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">R</text>
    <text x="110" y="390" font-size="15" font-weight="700" fill="#1A1530">Router</text>
    <text x="110" y="409" font-size="12" fill="#4A4560">decides which specialists</text>
    <text x="110" y="425" font-size="12" fill="#4A4560">to send, with a reason each</text>

    <rect x="56" y="452" width="238" height="174" rx="14" fill="none" stroke="#D9D1F5" stroke-dasharray="5 5"/>
    <text x="74" y="478" font-size="12" font-weight="700" letter-spacing="1" fill="#8A84A3">CLAIM SHEET (EXAMPLE)</text>
    <g font-size="12.5" fill="#4A4560">
      <text x="74" y="504">₹21,000 → ₹15,00,000 in 10 days</text>
      <text x="74" y="528">"Finance Minister + SBI"</text>
      <text x="74" y="552">sbi-govtscheme-invest.com</text>
      <text x="74" y="576">WhatsApp +44 7700 900123</text>
      <text x="74" y="600">"only for pensioners"</text>
    </g>
  </g>

  <!-- INVESTIGATE -->
  <g>
    <rect x="356" y="194" width="238" height="74" rx="14" fill="#EAF7F5"/>
    <circle cx="384" cy="231" r="16" fill="#0E8A7E"/><text x="384" y="236" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">Rg</text>
    <text x="410" y="222" font-size="15" font-weight="700" fill="#1A1530">Registry</text>
    <text x="410" y="241" font-size="12" fill="#4A4560">3,251 SEBI records and</text>
    <text x="410" y="257" font-size="12" fill="#4A4560">the RBI Alert List</text>

    <rect x="356" y="278" width="238" height="74" rx="14" fill="#EAF7F5"/>
    <circle cx="384" cy="315" r="16" fill="#0E8A7E"/><text x="384" y="320" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">W</text>
    <text x="410" y="306" font-size="15" font-weight="700" fill="#1A1530">Web and contact</text>
    <text x="410" y="325" font-size="12" fill="#4A4560">look-alike sites, foreign</text>
    <text x="410" y="341" font-size="12" fill="#4A4560">numbers, UPI IDs</text>

    <rect x="356" y="362" width="238" height="74" rx="14" fill="#EAF7F5"/>
    <circle cx="384" cy="399" r="16" fill="#0E8A7E"/><text x="384" y="404" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">L</text>
    <text x="410" y="390" font-size="15" font-weight="700" fill="#1A1530">Link</text>
    <text x="410" y="409" font-size="12" fill="#4A4560">where the button really</text>
    <text x="410" y="425" font-size="12" fill="#4A4560">goes, without opening it</text>

    <rect x="356" y="446" width="238" height="74" rx="14" fill="#EAF7F5"/>
    <circle cx="384" cy="483" r="16" fill="#0E8A7E"/><text x="384" y="488" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">C</text>
    <text x="410" y="474" font-size="15" font-weight="700" fill="#1A1530">Community memory</text>
    <text x="410" y="493" font-size="12" fill="#4A4560">sites, numbers and UPI IDs</text>
    <text x="410" y="509" font-size="12" fill="#4A4560">families already flagged</text>

    <rect x="356" y="530" width="238" height="74" rx="14" fill="#EAF7F5"/>
    <circle cx="384" cy="567" r="16" fill="#0E8A7E"/><text x="384" y="572" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">P</text>
    <text x="410" y="558" font-size="15" font-weight="700" fill="#1A1530">Scam-pattern</text>
    <text x="410" y="577" font-size="12" fill="#4A4560">returns maths, known tricks,</text>
    <text x="410" y="593" font-size="12" fill="#4A4560">prompt-injection detector</text>

    <!-- Link -> Web hand-off -->
    <path d="M594 399 C 606 399, 606 315, 596 315" fill="none" stroke="#0E8A7E" stroke-width="2" marker-end="url(#ahg)"/>
    <text x="566" y="620" font-size="11" fill="#0E8A7E" text-anchor="end" font-style="italic">Link hands a hidden site to Web ↑</text>
  </g>

  <!-- DEBATE -->
  <g>
    <rect x="656" y="194" width="238" height="74" rx="14" fill="#FDECEF"/>
    <circle cx="684" cy="231" r="16" fill="#E11D48"/><text x="684" y="236" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">⚖</text>
    <text x="710" y="222" font-size="15" font-weight="700" fill="#1A1530">Prosecutor</text>
    <text x="710" y="241" font-size="12" fill="#4A4560">files charges, each tied</text>
    <text x="710" y="257" font-size="12" fill="#4A4560">to evidence IDs</text>

    <rect x="656" y="278" width="238" height="74" rx="14" fill="#E9F8EE"/>
    <circle cx="684" cy="315" r="16" fill="#16A34A"/><text x="684" y="320" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">D</text>
    <text x="710" y="306" font-size="15" font-weight="700" fill="#1A1530">Defender</text>
    <text x="710" y="325" font-size="12" fill="#4A4560">accepts, disputes, or asks</text>
    <text x="710" y="341" font-size="12" fill="#4A4560">a specialist to CHECK</text>

    <!-- CHECK arrow back to investigate -->
    <path d="M656 330 C 630 330, 628 250, 598 240" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahg)"/>

    <rect x="656" y="366" width="238" height="260" rx="14" fill="none" stroke="#F3C6D1" stroke-dasharray="5 5"/>
    <text x="674" y="392" font-size="12" font-weight="700" letter-spacing="1" fill="#8A84A3">CHARGE SHEET</text>
    <g font-size="12.5">
      <rect x="672" y="406" width="30" height="20" rx="6" fill="#1A1530"/><text x="687" y="420" fill="#FFF" font-weight="700" text-anchor="middle" font-size="11">C1</text>
      <text x="710" y="420" fill="#4A4560">impossible returns</text>
      <text x="876" y="420" fill="#E11D48" font-weight="800" text-anchor="end" font-size="11">PROVEN</text>
      <rect x="672" y="440" width="30" height="20" rx="6" fill="#1A1530"/><text x="687" y="454" fill="#FFF" font-weight="700" text-anchor="middle" font-size="11">C2</text>
      <text x="710" y="454" fill="#4A4560">fake FM + SBI claim</text>
      <text x="876" y="454" fill="#E11D48" font-weight="800" text-anchor="end" font-size="11">PROVEN</text>
      <rect x="672" y="474" width="30" height="20" rx="6" fill="#1A1530"/><text x="687" y="488" fill="#FFF" font-weight="700" text-anchor="middle" font-size="11">C3</text>
      <text x="710" y="488" fill="#4A4560">UK WhatsApp no.</text>
      <text x="876" y="488" fill="#E11D48" font-weight="800" text-anchor="end" font-size="11">PROVEN</text>
      <rect x="672" y="508" width="30" height="20" rx="6" fill="#1A1530"/><text x="687" y="522" fill="#FFF" font-weight="700" text-anchor="middle" font-size="11">C4</text>
      <text x="710" y="522" fill="#4A4560">look-alike SBI sites</text>
      <text x="876" y="522" fill="#E11D48" font-weight="800" text-anchor="end" font-size="11">PROVEN</text>
    </g>
    <text x="674" y="560" font-size="12" fill="#4A4560">On a genuine post office ad the</text>
    <text x="674" y="578" font-size="12" fill="#4A4560">Defender wins: charges get</text>
    <text x="674" y="596" font-size="12" fill="#4A4560"><tspan font-weight="700" fill="#16A34A">WITHDRAWN</tspan> and nobody is scared.</text>
  </g>

  <!-- DECIDE -->
  <g>
    <rect x="956" y="194" width="268" height="74" rx="14" fill="#FFF5E0"/>
    <circle cx="984" cy="231" r="16" fill="#D08700"/><text x="984" y="236" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">A</text>
    <text x="1010" y="222" font-size="15" font-weight="700" fill="#1A1530">Arbiter</text>
    <text x="1010" y="241" font-size="12" fill="#4A4560">rules only on contested charges,</text>
    <text x="1010" y="257" font-size="12" fill="#4A4560">writes the answer in plain words</text>

    <rect x="956" y="278" width="268" height="74" rx="14" fill="none" stroke="#D08700" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="976" y="306" font-size="15" font-weight="700" fill="#1A1530">Guardrails</text>
    <text x="976" y="325" font-size="12" fill="#4A4560">fixed rules above the AI: hard</text>
    <text x="976" y="341" font-size="12" fill="#4A4560">evidence can never be overruled</text>

    <text x="958" y="392" font-size="12" font-weight="700" letter-spacing="1" fill="#8A84A3">ONE CLEAR ANSWER</text>
    <rect x="956" y="406" width="130" height="44" rx="12" fill="#E11D48"/><text x="1021" y="434" font-size="15" font-weight="800" fill="#FFF" text-anchor="middle">SCAM</text>
    <rect x="1094" y="406" width="130" height="44" rx="12" fill="#F5B21B"/><text x="1159" y="434" font-size="14" font-weight="800" fill="#1A1530" text-anchor="middle">BE CAREFUL</text>
    <rect x="956" y="458" width="130" height="44" rx="12" fill="#16A34A"/><text x="1021" y="486" font-size="13" font-weight="800" fill="#FFF" text-anchor="middle">LOOKS GENUINE</text>
    <rect x="1094" y="458" width="130" height="44" rx="12" fill="#E7E3F2"/><text x="1159" y="486" font-size="14" font-weight="800" fill="#4A4560" text-anchor="middle">NOT AN AD</text>

    <text x="958" y="534" font-size="12.5" fill="#4A4560">in English, हिंदी or తెలుగు, read aloud,</text>
    <text x="958" y="554" font-size="12.5" fill="#4A4560">with Send to family on WhatsApp and</text>
    <text x="958" y="574" font-size="12.5" fill="#4A4560">a ready complaint for the 1930 helpline</text>
  </g>

  <!-- phase arrows -->
  <g stroke="#6D4AFF" stroke-width="2.5" marker-end="url(#ah)">
    <line x1="312" y1="377" x2="336" y2="377"/>
    <line x1="612" y1="377" x2="636" y2="377"/>
    <line x1="912" y1="377" x2="936" y2="377"/>
  </g>

  <!-- blackboard -->
  <rect x="40" y="664" width="1200" height="84" rx="18" fill="#1B1433"/>
  <text x="68" y="698" font-size="13" font-weight="800" letter-spacing="1.5" fill="#B7A8FF">SHARED BLACKBOARD</text>
  <text x="68" y="726" font-size="14" fill="#EDE9FF">Every finding is written once with an evidence ID (E1, E2 …). Charges must cite them. Every message streams live to the screen.</text>
</svg>
